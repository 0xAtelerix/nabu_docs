site_name: Nabu Documentation
# Markdown is in repo root; config lives in assets/
docs_dir: ..
# CI expects the built site at /site (see deploy script: test -d /site)
site_dir: /site
exclude_docs: |
  README.md
theme:
  name: material
  logo: assets/images/image.avif
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

extra_css:
  - stylesheets/extra.css
nav:
  - 🧭 Start here:
      - Introduction: index.md
      - Vision: vision.md
      - Why now?: why-now.md
  - 🧠 The Challenge:
      - The challenge: challenge.md
  - ✅ The Solution:
      - The Solution: solution.md
      - Strategy flywheel: flywheel.md
      - Ecosystem & economics: ecosystems.md
  - 🛠️ Nabu technology:
      - Roadmap: roadmap.md
      - Nabu technology: technology.md
  - 🏃‍♂️ GETTING STARTED:
      - "how to use nabu: a step by step guide": getting-started/how-to-use-nabu-a-step-by-step-guide.md
  - 💡 Knowledge Base:
      - Glossary: glossary.md

plugins:
  - search
  - tags
extra_javascript:
  - assets/javascripts/extra.js
